<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="deps/background-check.js"></script>
    <script src="deps/background-check.min.js"></script>
    <script src="deps/countUp.js"></script>
    <script src="deps/reconnecting-websocket.min.js"></script>
</head>

<body>
    <div id="pickerWC">
        <div id="pointerWC">
            <div id="pointerkiri" class="pointerobj"></div>
            <div id="garispointer"></div>
            <div id="pointerkanan" class="pointerobj"></div>
        </div>
        <div id="rollercontainer">
            <div id="gacor">

        </div>

        </div>
    </div>
    <div id="main">
        <!-- <div id="topBar"></div> -->
        <div id="mappoolContainer">
            <div id="RC" class="mapContainer"></div>
            <div id="LN" class="mapContainer"></div>
            <div id="HB" class="mapContainer"></div>
            <div id="SV" class="mapContainer"></div>
            <div id="WC" class="mapContainer"></div>
            <div id="TB" class="mapContainer"></div>
        </div>
        <!-- <div id="bottom"></div> -->
    </div>
    <div id="sideBar">
        <div id="pickButtonR" class="pickButton"></div>
        <div id="pickButtonB" class="pickButton"></div>
        
        <div id="pickState">First Team to pick: </div>
        <div style="margin-top: 20px;">Input manual wildcard MAP ID</div>
        <form> <select id="WCmapid" class="pickButton">
            <option value="1">kiri</option>
            <option value="0" >kanan</option>
          </select><input id="inputWCmanual" type="text" class="pickButton"></input></form>
        <div id="resetWILDCARD" class="pickButton">Reset WC</div>
        <div id="tutupwilcard" class="pickButton">Close WC</div>
        <input id="matchID" type="text" class="pickButton"></input>
        <div id="roll" class="pickButton">Roll</div>
    </div>
    <script src="index.js"></script>
    <script>
        const gacor = document.getElementById("gacor");
        document.getElementById("tutupwilcard").addEventListener("click", function() {
        document.getElementById("pickerWC").style.visibility = "hidden";
        const rollItems = document.querySelectorAll(".rollItem");
        
        // Loop through each element and remove it
        rollItems.forEach(item => {
        item.remove();
        });

        gacor.style.marginTop = "10px"
    });
        document.getElementById("roll").addEventListener("click", function() {
        
        gacor.style.marginTop = "-4690px"
        // gacor.style.marginTop = "-4780px"

        const matchID = document.getElementById("matchID"); if (!matchID.value) {matchID.value = "woi"; return;;;;;;;;;;;} //if kosong, GAJADI LOL
        const url = `https://script.google.com/macros/s/AKfycbxyQ67MlGCrIK3AMNDdJ28ZS_vYqvSmR1T6bS-kr4-q06hMhPi2g-ERErw1nrfxCv4-TA/exec?action=sendToRef&matchID=${matchID.value}`;
        
        try {   
            const response = fetch(url);
            const data = response.json();  // Get JSON data from response
            console.log('Fetched data:', data);  // Log the fetched data
            return data;  // Return the data to the calling function
        } catch (error) {
            console.error('Error fetching data:', error);  // Catch any errors
            return null;  // Return null in case of an error
        }

            

    });

</script>
</body>

</html>
